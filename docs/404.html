  <!-- Early Theme Initialization to Prevent Flash of Wrong Theme -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('weddingTheme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');

  <!-- Early Preloaded Wedding Hymn Audio for Instant Launch Autoplay -->
  <audio id="wedding-bg-audio" src="./assets/music/wedding.mp3" loop preload="auto" playsinline></audio>
  <script>
    (function() {
      var audio = document.getElementById('wedding-bg-audio');
      if (!audio) return;
      audio.volume = 0.75;
      
      var hasStarted = false;
      function tryPlay() {
        if (hasStarted || !audio.paused) return;
        var p = audio.play();
        if (p !== undefined) {
          p.then(function() {
            hasStarted = true;
          }).catch(function() {
            // Autoplay restricted until interaction
          });
        }
      }

      // 1. Attempt immediately on HTML parse
      tryPlay();

      // 2. Attempt on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryPlay, { once: true });
      }

      // 3. One-time gesture unlock on ANY first interaction (touch, click, scroll, mouse movement)
      var events = ['click', 'touchstart', 'touchend', 'scroll', 'mousemove', 'pointerdown', 'pointermove', 'wheel', 'keydown'];
      function unlockOnInteraction() {
        if (!hasStarted) {
          tryPlay();
        }
        events.forEach(function(e) {
          window.removeEventListener(e, unlockOnInteraction, true);
        });
      }
      events.forEach(function(e) {
        window.addEventListener(e, unlockOnInteraction, { capture: true, passive: true, once: true });
      });
    })();
  </script>
  <div id="root"></div>
